<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 실시간 실험실</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><main>
<header><div><small>교사용 · 전자칠판</small><h1>전압과 전류, 함께 보는 실험실</h1></div><button id="full">전체 화면</button></header>
<p id="error" role="status" aria-live="polite"></p>
<section class="panel" id="loginPanel"><h2>교사 로그인</h2><p>서버 실행 창에 표시된 교사 비밀번호를 입력하세요.</p><form id="login"><input id="password" type="password" placeholder="교사 비밀번호" autocomplete="current-password" required><button>로그인</button></form></section>
<section class="panel" id="createPanel" hidden><form id="create"><input id="title" value="전압과 전류 실험" maxlength="80" aria-label="수업 이름"><button>새 수업 시작</button></form><p>최근 수업은 이 브라우저에서 자동으로 다시 열립니다.</p></section>
<section class="panel" id="roomPanel" hidden><header><div><h2 id="roomTitle"></h2><small>학생 참여 코드</small><div id="code"></div></div><div><p id="counts"></p><p id="updated"></p><div class="actions"><button id="copy">학생 주소 복사</button><button id="export">기록 내려받기</button><button id="close">수업 종료</button></div></div></header><p><a id="studentLink" target="_blank" rel="noopener"></a></p><small>약 1초 간격으로 갱신 · 모둠 카드를 펼치면 측정 기록과 답변을 볼 수 있습니다.</small></section>
<section id="groups" class="grid" aria-label="모둠별 실험 현황"></section>
</main><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="/teacher-chart.js"></script><script>
let token=sessionStorage.getItem('teacherToken')||'',code=localStorage.getItem('teacherRoom')||'',snapshot=null,polling=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined,signal:AbortSignal.timeout(8000)});const x=await r.json();if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('teacherToken');show();}throw Error(x.error);}return x;}
function show(){$('loginPanel').hidden=!!token;$('createPanel').hidden=!token;}
const charts=new Map();
function plot(points,group){return '<div class="teacher-plot"><canvas id="group-chart-'+group+'" aria-label="'+group+'조 전압 전류 그래프" role="img"></canvas></div>';}
function updateCharts(x){
 for(let num=1;num<=6;num++){
  const placeholder=document.getElementById('group-chart-'+num);
  let chart=charts.get(num);
  if(chart){placeholder.replaceWith(chart.canvas);}else{
   if(typeof window.createStudentChart!=='function'||typeof Chart==='undefined'){
    placeholder.parentElement.textContent='그래프 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침하세요.';continue;
   }
   chart=createStudentChart(placeholder,num);charts.set(num,chart);
  }
  const points=x.groups.find(g=>g.num===num)?.state.points||[];
  chart.data.datasets[0].data=points;
  chart.options.scales.x.max=Math.max(7.5,...points.map(p=>p.x));
  chart.resize();chart.update('none');
 }
}
if(document.fonts)document.fonts.ready.then(()=>{for(const chart of charts.values())chart.update('none');});
function render(x){snapshot=x;$('roomPanel').hidden=false;$('roomTitle').textContent=x.room.title+(x.room.active?'':' · 종료');$('code').textContent=code;$('close').disabled=!x.room.active;const url=location.origin+'/student?code='+code;$('studentLink').href=url;$('studentLink').textContent=url;$('counts').textContent='참여 '+x.groups.length+'/6조 · 측정 완료 '+x.groups.filter(g=>g.state.step===6).length+'조';$('updated').textContent='마지막 확인 '+new Date().toLocaleTimeString('ko-KR');
for(const chart of charts.values())chart.canvas.remove();
const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.group));
$('groups').innerHTML=Array.from({length:6},(_,i)=>{const g=x.groups.find(g=>g.num===i+1),s=g?.state||{},online=g&&x.now-g.seen<12;return '<article class="'+(g&&!online?'offline':'')+'"><header><h2>'+ (i+1)+'조</h2><span>'+(!g?'참여 대기':online?'● 접속 중':'○ 연결 확인 필요')+'</span></header><p>'+esc(s.status||'센서 연결 대기')+'</p><div class="readings"><span>'+esc(s.voltage||'—')+' V</span><span>'+esc(s.current||'—')+' A</span></div><p>실험 단계 '+(s.step||0)+'/6 '+(s.step===6?'· 측정 완료':'')+'</p><progress value="'+(s.step||0)+'" max="6"></progress>'+plot(s.points,i+1)+'<details data-group="'+(i+1)+'" '+(open.has(String(i+1))?'open':'')+'><summary>측정값과 답변 펼치기</summary><p>그래프 점 '+(s.points||[]).length+'개</p><pre>'+esc((s.points||[]).map(p=>Number(p.x).toFixed(3)+' V / '+Number(p.y).toFixed(3)+' A').join('\n')||'아직 측정하지 않았습니다.')+'</pre><h3>1. 건전지 수와 전압</h3><pre>'+esc(s.answer1||'작성 전')+'</pre><h3>2. 전압과 전류의 관계</h3><pre>'+esc(s.answer2||'작성 전')+'</pre></details></article>';}).join('');updateCharts(x);}
async function poll(){if(!token||!code||polling)return;polling=true;try{render(await api('/api/rooms/'+code));$('error').textContent='';}catch(e){$('error').textContent=e.message+' · 자동 재연결 중';}finally{polling=false;}}
$('login').onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/login',{password:$('password').value});token=x.token;sessionStorage.setItem('teacherToken',token);$('password').value='';$('error').textContent='';show();poll();}catch(e){$('error').textContent=e.message;}};
$('create').onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/create',{title:$('title').value});code=x.code;localStorage.setItem('teacherRoom',code);poll();}catch(e){$('error').textContent=e.message;}};
$('close').onclick=async()=>{if(!confirm('수업을 종료하면 학생의 추가 전송이 중단됩니다. 종료할까요?'))return;try{await api('/api/close',{code});poll();}catch(e){$('error').textContent=e.message;}};
$('export').onclick=async()=>{try{const x=await api('/api/rooms/'+code+'/export');const url=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='실험기록_'+code+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){$('error').textContent=e.message;}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('studentLink').href);$('error').textContent='학생 주소를 복사했습니다.';}catch{$('error').textContent='학생 주소를 직접 선택해 복사하세요.';}};
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();show();poll();setInterval(poll,1000);
</script></body></html>
